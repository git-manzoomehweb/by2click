<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover">
    <!-- Title & Description -->
    <title>[##cms.seo.title|(The requested page was not found.)##]</title>
    <meta name="description" content="[##cms.seo.description|(The requested page was not found.)##]">
    <!-- Taglist -->
    <basis core="dbsource" source="hosting" name="tag" urlid="[##cms.seo.urlid##]">
        <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
        <face filter="key = 'canonical'">
            <link rel="canonical" href="@value" />
        </face>
        <face>
            <meta property="@key" content="@value" />
        </face>
    </basis>
    <!-- pwa metatags -->
    <basis core="call" file="pwa.inc" lid="2" />
    <!-- define -->
    <link rel="preload" as="image" imageSrcSet="image address" fetchpriority="high" />
    <!-- common styles for all page -->
    <basis core="call" file="style.inc" lid="2" />
</head>

<body>
    <basis core="call" file="header.inc" lid="2" />
    <main>
        <section class="flex flex-col items-center my-44">
            <img src="[##cms.cms.cdn##]/images/404Icon.png" class="h-[500px] object-cover" alt="404" width="500"
                height="500" loading="lazy">
            <h1 class="my-3 text-zinc-900">The requested page was not found.</h1>
            <a href="/"
                class="relative group z-10 flex items-center justify-center w-48 h-14 text-white rounded-lg bg-primary-800 transition-all duration-300">Go
                to Homepage
                <div
                    class="absolute inset-0 bg-[linear-gradient(270deg,_#FF3535_3.33%,_#CF1919_100%)] opacity-0 transition-opacity duration-300 group-hover:opacity-100 rounded-lg -z-10">
                </div>
            </a>
        </section>
    </main>
    <basis core="call" file="footer.inc" lid="2" />
</body>

</html>
