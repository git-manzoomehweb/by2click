<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover">
        <!-- Title & Description -->
        <title>[##cms.seo.title|(Internal Server Error)##]</title>
        <meta name="description" content="[##cms.seo.description|(There was a problem connecting to the server.)##]">
        <!-- Taglist -->
        <basis core="dbsource" source="hosting" name="tag" urlid="[##cms.seo.urlid##]">
            <member type="list" name="list" request="taglist" preview=""></member>
        </basis>
        <basis core="print" datamembername="tag.list">
            <face filter="key = 'canonical'">
                <link rel="canonical" href="@value" />
            </face>
            <face>
                <meta property="@key" content="@value" />
            </face>
        </basis>
        <!-- pwa metatags -->
        <basis core="call" file="pwa.inc" lid="2"/>
        <!-- define -->
        <link rel="preload" as="image" imageSrcSet="image address" fetchpriority="high" />
        <!-- common styles for all page -->
        <basis core="call" file="style.inc" lid="2" pageindex="[##cms.cms.pageindex##]"/>
    </head>
<body>
    <basis core="call" file="header.inc" lid="2" pageindex="[##cms.cms.pageindex##]"/>
    <main>
            <section class="flex flex-col items-center mt-32 mb-52">
                <img src="[##cms.cms.cdn##]/images/500Icon.png" class="h-48 object-cover" alt="500" width="196" height="196" loading="lazy">
                <h1 class="mb-3 mt-10 text-zinc-800 text-center max-w-[60%]">There was a problem connecting to the server.</h1>
                <a href="/" class="flex items-center justify-center w-48 h-14 text-white rounded-lg bg-primary-800 transition-all duration-300 hover:bg-primary-600">Go to Homepage</a>
            </section>
    </main>
    <basis core="call" file="footer.inc" lid="2" pageindex="[##cms.cms.pageindex##]"/>
</body>
</html>
